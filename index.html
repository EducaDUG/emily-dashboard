<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emily Learning Dashboard</title>
<style>
  :root{
    /* Palette pulled directly from Discovery Lab's live homepage
       (https://educadug.github.io/discovery-lab/, engine/style.css?v=12),
       which renders with :root, [data-theme="earth"] - "Environmental Science -
       soil, water, air". Confirmed against the fetched stylesheet, not invented. */
    --paper:#F2EFE6; --surface:#FBF9F3; --surface-2:#EAE6D9;
    --ink:#1D211C; --ink-2:#4A5148; --ink-3:#757C72;
    --line:#1D211C24; --line-strong:#1D211C40;
    --accent:#40634C; --accent-hi:#517B5E; --accent-ink:#FBF9F3;
    --accent-wash:#40634C14;
    --signal:#B5551F; --signal-wash:#B5551F14;
    --positive:#2F6B45; --caution:#A66B00;
    --radius:14px; --radius-lg:22px;
    --font-display:"Fraunces","Iowan Old Style",Georgia,serif;
    --font-ui:"Public Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
    --font-data:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-ui);background-color:var(--paper);color:var(--ink);line-height:1.55;
    /* Faint field-notebook grid, same recipe as the Discovery Lab homepage body rule. */
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:48px 48px,48px 48px;
    background-position:-1px -1px;
  }
  a{color:var(--signal);}
  .eyebrow-label{font-family:var(--font-data);font-size:0.72rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--signal);display:inline-flex;align-items:center;gap:6px;}
  .target-icon{display:inline-block;width:14px;height:14px;vertical-align:middle;color:var(--signal);}
  .shell{max-width:920px;margin:0 auto;padding:0 20px;}
  header.site{background:var(--surface);border-bottom:1px dashed var(--line-strong);padding:22px 0;}
  header.site h1{font-family:var(--font-display);font-size:1.9rem;margin:0 0 4px;
    font-variation-settings:"wght" 600;}
  header.site p{margin:0;color:var(--ink-2);font-size:0.95rem;}
  nav.tabs{display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border-bottom:1px dashed var(--line-strong);
    padding:10px 0;position:sticky;top:0;z-index:5;}
  nav.tabs .shell{display:flex;gap:8px;flex-wrap:wrap;}
  .tab-btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);
    padding:9px 14px;border-radius:999px;font:inherit;font-family:var(--font-data);
    text-transform:uppercase;letter-spacing:.04em;font-weight:700;font-size:0.78rem;cursor:pointer;}
  .tab-btn.active{background:var(--signal);color:var(--accent-ink);border-color:var(--signal);}
  main{padding:26px 0 60px;}
  .panel{display:none;}
  .panel.active{display:block;}
  h2.panel-title{font-family:var(--font-display);font-size:1.5rem;margin:0 0 6px;}
  .panel-sub{color:var(--ink-2);margin:0 0 20px;font-size:0.95rem;max-width:64ch;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:18px 20px;margin-bottom:16px;}
  .card + .card{border-top:1px dashed var(--line-strong);}
  .card h3{margin:0 0 8px;font-size:1.05rem;font-family:var(--font-display);}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:var(--radius);padding:14px 16px;}
  .stat .num{font-family:var(--font-data);font-size:1.6rem;font-weight:700;color:var(--accent);}
  .stat .label{font-size:0.8rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;}
  .focus-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
  .focus-card{border-radius:var(--radius);padding:16px;border:1px solid var(--line);}
  .focus-card.win{border-left:4px solid var(--positive);background:#2F6B4508;}
  .focus-card.tonight{border-left:4px solid var(--signal);background:var(--signal-wash);}
  .focus-card.edge{border-left:4px solid var(--caution);background:#A66B0010;}
  .focus-card .eyebrow{font-family:var(--font-data);font-size:.72rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--ink-2);margin-bottom:6px;}
  .quote-card{border-left:3px solid var(--accent);padding:12px 16px;margin-bottom:10px;background:var(--surface);
    border-radius:var(--radius);}
  .quote-card blockquote{margin:0 0 6px;font-family:var(--font-display);font-size:1.05rem;font-style:italic;color:var(--ink);}
  .quote-card .interp{font-size:0.85rem;color:var(--ink-2);}
  .pill{display:inline-block;font-family:var(--font-data);font-size:0.72rem;text-transform:uppercase;
    letter-spacing:.06em;padding:3px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2);
    background:var(--surface-2);margin-right:6px;}
  .pill.stage-Emerging{color:#A66B00;border-color:#A66B0055;background:#A66B0014;}
  .pill.stage-Developing{color:#B5551F;border-color:#B5551F55;background:#B5551F14;}
  .pill.stage-Growing{color:#517B5E;border-color:#517B5E55;background:#517B5E14;}
  .pill.stage-Secure{color:#2F6B45;border-color:#2F6B4555;background:#2F6B4514;}
  .chart-card svg{width:100%;height:auto;display:block;}
  .chart-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:0.82rem;color:var(--ink-2);}
  .legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .evidence-pop{display:none;margin-top:10px;padding:10px 12px;border-radius:var(--radius);
    background:var(--surface-2);font-size:0.86rem;color:var(--ink-2);}
  .evidence-pop.show{display:block;}
  .milestone{display:flex;gap:12px;margin-bottom:14px;}
  .milestone .dot{width:10px;height:10px;border-radius:50%;background:var(--signal);flex:0 0 auto;margin-top:6px;}
  .milestone .date{font-family:var(--font-data);font-size:0.78rem;color:var(--ink-3);}
  .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .profile-grid .item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;}
  .profile-grid .item .k{font-family:var(--font-data);font-size:0.72rem;text-transform:uppercase;color:var(--ink-2);
    margin-bottom:4px;}
  .basis-note{font-size:0.8rem;color:var(--ink-3);margin-top:6px;}
  ul.plain{margin:0;padding-left:18px;}
  ul.plain li{margin-bottom:6px;}
  details.session{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;background:var(--surface);}
  details.session summary{padding:12px 16px;cursor:pointer;font-weight:700;list-style:none;font-family:var(--font-display);}
  details.session summary::-webkit-details-marker{display:none;}
  details.session summary .sdate{font-family:var(--font-data);font-size:0.78rem;color:var(--ink-2);
    font-weight:400;display:block;text-transform:uppercase;letter-spacing:.04em;}
  details.session .session-body{padding:0 16px 16px;border-top:1px dashed var(--line-strong);}
  details.session .session-body h4{font-size:0.85rem;margin:14px 0 6px;color:var(--ink-2);text-transform:uppercase;
    letter-spacing:.03em;}
  .resource-link{display:block;margin-bottom:8px;}
  .resource-link a{font-weight:700;word-break:break-word;}
  .resource-link .note{font-size:0.85rem;color:var(--ink-2);}
  .about-portrait-row{display:flex;gap:18px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .btn-linkedin{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);
    padding:10px 16px;border-radius:999px;text-decoration:none;font-weight:700;font-size:0.9rem;}
  .about-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:22px;}
  .about-photo-wrap{position:relative;width:168px;height:168px;margin:6px 0 8px;display:flex;align-items:center;justify-content:center;}
  .about-photo-wrap::before{content:"";position:absolute;inset:-22px;border-radius:50%;
    background:radial-gradient(circle,#40634C55 0%,#40634C22 40%,transparent 72%);}
  .about-photo-wrap::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent-hi);opacity:.65;}
  .about-photo{position:relative;width:168px;height:168px;border-radius:50%;object-fit:cover;
    border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong);z-index:1;}
  .about-heading{font-family:var(--font-display);font-size:1.9rem;margin:2px 0 0;font-variation-settings:"wght" 600;}
  .about-subheading{color:var(--ink-2);max-width:52ch;margin:0;font-size:0.98rem;}
  .about-chip-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px;}
  .about-chip{font-family:var(--font-data);font-size:0.72rem;text-transform:uppercase;letter-spacing:.05em;
    padding:5px 12px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2);background:var(--surface-2);}
  .about-closing h3{margin:0 0 6px;font-family:var(--font-display);font-size:1.1rem;}
  footer.disclaimer{border-top:1px solid var(--line);margin-top:24px;padding-top:16px;font-size:0.8rem;color:var(--ink-3);}
  @media (max-width:640px){
    .stat-row,.focus-row,.profile-grid{grid-template-columns:1fr;}
  }
</style>
</head>

<script>
const DISCLAIMER = "This is a voluntary teaching resource created by Mr. Guevara to add as much value as possible for families and students. It is not a requirement of Crimson Global Academy, and other teachers may not provide anything similar — this is not part of what CGA officially offers. Please refer to the Learning Lab as the official Crimson Global Academy resource, where assignments, grades, deadlines, and formal progress reports are provided. The information here is supplementary and is not part of any official session report or progress report sent by the school.";

function esc(s){
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* Some upstream data fields that are meant to be a list of short phrases were
   saved either as a real JS/JSON array, OR (a data bug seen in a few student
   files) as a single string holding a Python-repr list literal such as
   "['phrase one', 'phrase two']". Both must render as natural prose, never as
   raw bracket/quote syntax. This helper normalises either shape into a plain
   array of strings; a normal sentence-shaped string is returned unchanged. */
function parsePyListLiteral(str){
  const trimmed = String(str).trim();
  if (!/^\[[\s\S]*\]$/.test(trimmed)) return null;
  const inner = trimmed.slice(1, -1).trim();
  if (!inner) return [];
  const parts = inner.split(/['"]\s*,\s*['"]/);
  return parts.map(p => p.replace(/^\s*['"]/, "").replace(/['"]\s*$/, "").trim()).filter(Boolean);
}

function toArrayOfStrings(v){
  if (Array.isArray(v)) return v.map(x => String(x).trim()).filter(Boolean);
  if (typeof v === "string") {
    const parsed = parsePyListLiteral(v);
    if (parsed !== null) return parsed;
  }
  return null;
}

/* Join a list of short phrases into flowing prose: "a", "a and b", or
   "a, b, and c". Returns "" for an empty/missing list so callers can hide
   the field entirely instead of showing empty punctuation. */
function joinProse(arr){
  if (!arr || !arr.length) return "";
  if (arr.length === 1) return arr[0];
  if (arr.length === 2) return `${arr[0]} and ${arr[1]}`;
  return `${arr.slice(0, -1).join(", ")}, and ${arr[arr.length - 1]}`;
}

/* Renders any field that might be a plain string, a real array, or the
   Python-repr-list-as-string bug as clean prose text (HTML-escaped). */
/* Capitalizes the first letter of a joined/flowing sentence without
   touching the rest of the string (so mid-sentence proper nouns etc. are
   left alone). Safe to call on an already-capitalized or empty string. */
function capitalizeFirst(s){
  if (!s) return s;
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function proseField(v){
  const asArray = toArrayOfStrings(v);
  if (asArray !== null) return capitalizeFirst(esc(joinProse(asArray)));
  return capitalizeFirst(esc(v || ""));
}

function footerHtml(){

/* ---------------- PROGRESS TAB (chart) ---------------- */
const STAGE_Y = {Emerging: 3, Developing: 2, Growing: 1, Secure: 0};
const STAGE_RANK = {Emerging: 0, Developing: 1, Growing: 2, Secure: 3};
const STAGE_BY_RANK = ["Emerging", "Developing", "Growing", "Secure"];
// A small categorical palette assigned by thread INDEX (not by name), so it
// works for any student's thread names. Chosen for strong hue separation
// (blue / rust-orange / violet / mustard-gold) rather than shades of one
// colour, while staying muted/earthy so it still sits inside the warm,
// cream "earth" theme. Distinct in both hue and lightness so the lines
// stay tellable apart for common red-green colour vision deficiencies too.
const THREAD_PALETTE = ["#2A6F8F", "#B5551F", "#6B4C9A", "#B58900"];
function colorForThread(index){
  return THREAD_PALETTE[index % THREAD_PALETTE.length];
}
const LINE_COL = "#1D211C24";
const INK2 = "#4A5148";
const INK3 = "#757C72";

function shortDate(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

function buildChartSVG(threads){
  const W = 780, H = 300, padL = 140, padR = 20, padT = 20, padB = 46;
  const allDates = [...new Set(Object.values(threads).flat().map(p => p.session_date_iso))].sort();
  const x = d => {
    const idx = allDates.indexOf(d);
    const n = Math.max(allDates.length - 1, 1);
    return padL + (idx / n) * (W - padL - padR);
  };
  const rowH = (H - padT - padB) / 4;
  const y = stage => padT + STAGE_Y[stage] * rowH + rowH / 2;

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-ui),sans-serif">`;

  // Stage rows: qualitative stage NAMES are the only y-axis labels, never numbers.
  ["Secure","Growing","Developing","Emerging"].forEach((stage, i) => {
    const yy = padT + i * rowH + rowH / 2;
    svg += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="${LINE_COL}" stroke-width="1" stroke-dasharray="3 5"/>`;
    svg += `<text x="8" y="${yy + 4}" font-size="12" fill="${INK2}" font-weight="700">${stage}</text>`;
  });

  // Dated x-axis: a step line under the plot with a dashed tick per session date.
  const axisY = padT + 4 * rowH;
  svg += `<line x1="${padL}" y1="${axisY}" x2="${W - padR}" y2="${axisY}" stroke="${LINE_COL}" stroke-width="1"/>`;
  allDates.forEach(d => {
    const px = x(d);
    svg += `<line x1="${px}" y1="${axisY}" x2="${px}" y2="${axisY + 6}" stroke="${LINE_COL}" stroke-width="1" stroke-dasharray="2 3"/>`;
    svg += `<text x="${px}" y="${axisY + 22}" font-size="10" fill="${INK3}" text-anchor="middle" transform="rotate(0 ${px} ${axisY+22})" font-family="var(--font-data),monospace">${shortDate(d)}</text>`;
  });

  let pointId = 0;
  const points = [];
  Object.entries(threads).forEach(([threadName, pts], threadIndex) => {
    const color = colorForThread(threadIndex);
    const sorted = [...pts].sort((a,b) => a.session_date_iso.localeCompare(b.session_date_iso));
    // Step line (not a smooth diagonal): holds the current stage until the
    // next dated observation, which better reflects a qualitative plateau.
    let path = "";
    sorted.forEach((p, i) => {
      const px = x(p.session_date_iso), py = y(p.stage);
      if (i === 0) { path += `M${px},${py} `; }
      else {
        const prevPx = x(sorted[i-1].session_date_iso);
        path += `L${px},${y(sorted[i-1].stage)} L${px},${py} `;
      }
    });
    svg += `<path d="${path.trim()}" fill="none" stroke="${color}" stroke-width="2.5" opacity="0.85"/>`;
    sorted.forEach(p => {
      const px = x(p.session_date_iso), py = y(p.stage);
      const id = "pt" + (pointId++);
      points.push({id, threadName, ...p});
      svg += `<circle cx="${px}" cy="${py}" r="5" fill="${color}" stroke="${'#FBF9F3'}" stroke-width="1.5" style="cursor:pointer" onclick="showEvidence('${id}')"/>`;
    });
  });
  svg += `</svg>`;
  window.__chartPoints = points;
  return svg;
}

function showEvidence(id){
  const p = (window.__chartPoints || []).find(pt => pt.id === id);
  const el = document.getElementById('evidence-pop');
  if (!el || !p) return;
  el.innerHTML = `<strong>${esc(p.threadName)} — ${esc(p.stage)}</strong> (${esc(p.session_date)}, "${esc(p.lesson_title)}")<br>${esc(p.evidence)}`;

}
